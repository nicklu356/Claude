<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>POTATO video renderer</title>
<link rel="stylesheet" href="/node_modules/@fontsource/nunito/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/nunito/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/nunito/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/nunito/900.css">
<link rel="stylesheet" href="/node_modules/@fontsource/baloo-2/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/baloo-2/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-tc/500.css">

<style>
:root {
  --purple: #7B4B94; --purple-d: #5A3370; --purple-l: #EDE3F3;
  --orange: #F28C28; --orange-l: #FFE6CC;
  --green: #4CAF50; --green-d: #2E7D32; --green-l: #E3F2E1;
  --cream: #FFF4E0; --navy: #1F2A44; --navy-2: #46506A; --red: #E0544B;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
body { font-family: Nunito, "Noto Sans TC", sans-serif; color: var(--navy); }
.zh, [lang="zh-Hant"] { font-family: "Noto Sans TC", Nunito, sans-serif; }
#stage { position: absolute; inset: 0; overflow: hidden; }
canvas#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.scene { position: absolute; inset: 0; display: none; }
.abs { position: absolute; }
.bg2d { position: absolute; inset: 0; background: var(--cream); overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
.dots { position: absolute; inset: -40px; background-image: radial-gradient(rgba(123,75,148,.13) 2.5px, transparent 2.6px); background-size: 46px 46px; }

/* subtitles */
#subs { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; z-index: 50; }
#subs .bar { background: rgba(18, 22, 38, .74); color: #fff; font: 700 40px/1.28 Nunito, "Noto Sans TC"; padding: 10px 30px 12px; border-radius: 16px; text-align: center; max-width: 1400px; letter-spacing: .2px; }
/* lower third (feature label) */
#lt { position: absolute; left: 64px; bottom: 168px; z-index: 40; display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 999px; padding: 12px 30px 12px 14px; box-shadow: 0 10px 30px rgba(31,42,68,.18); opacity: 0; }
#lt .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--purple); display: grid; place-items: center; }
#lt .k { font: 800 18px Nunito; letter-spacing: 2px; color: var(--orange); text-transform: uppercase; }
#lt .v { font: 900 30px Nunito; color: var(--navy); line-height: 1.05; }
/* wipe */
#wipe { position: absolute; inset: -10%; z-index: 45; transform: translateX(-130%) skewX(-12deg); display: flex; }
#wipe div { flex: 1; }

/* generic UI */
.card { background: #fff; border-radius: 28px; box-shadow: 0 18px 50px rgba(31,42,68,.14); }
.chip { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 8px 20px; font: 800 24px Nunito; }
.h1 { font: 900 64px/1.05 "Baloo 2", Nunito; color: var(--navy); }
.h2 { font: 800 40px/1.1 "Baloo 2", Nunito; color: var(--navy); }
.muted { color: var(--navy-2); }
.bubble { position: absolute; background: #fff; border-radius: 28px; padding: 14px 30px; font: 900 44px "Baloo 2", Nunito; color: var(--purple); box-shadow: 0 10px 30px rgba(31,42,68,.2); white-space: nowrap; transform-origin: 20% 100%; }
.bubble:after { content: ""; position: absolute; left: 36px; bottom: -18px; border: 12px solid transparent; border-top: 16px solid #fff; border-left: 12px solid #fff; }

/* visor panel (Spud's face screen enlarged) */
.visor { position: absolute; width: 1000px; height: 700px; }
.visor .ear { position: absolute; top: -78px; width: 120px; height: 150px; background: linear-gradient(160deg, #66BB6A, #3E9A44); border-radius: 0 100% 0 100%; }
.visor .ear.l { left: 80px; transform: rotate(-12deg); }
.visor .ear.r { right: 80px; transform: rotate(102deg); }
.visor .shell { position: absolute; inset: 0; border-radius: 140px; background: radial-gradient(120% 100% at 30% 20%, #9567AE, var(--purple) 55%, var(--purple-d)); box-shadow: 0 30px 80px rgba(31,42,68,.35); }
.visor .bezel { position: absolute; left: 50px; right: 50px; top: 60px; bottom: 60px; border-radius: 80px; background: var(--navy); padding: 16px; }
.visor .screen { position: relative; width: 100%; height: 100%; border-radius: 66px; background: linear-gradient(180deg, #FFF8EC, #FFE2BC); overflow: hidden; }
.visor .sensor { position: absolute; left: 50%; top: 26px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #15151d; }
.pane { position: absolute; inset: 0; padding: 28px 46px; }
.issue { display: flex; align-items: center; gap: 20px; background: #fff; border-radius: 24px; padding: 12px 22px; margin-bottom: 12px; box-shadow: 0 6px 16px rgba(31,42,68,.08); border: 3px solid transparent; }
.issue .ico { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; flex: none; }
.issue .t { font: 900 30px Nunito; }
.issue .m { font: 700 22px Nunito; color: var(--navy-2); margin-top: 2px; }
.rank { width: 46px; height: 46px; border-radius: 50%; background: var(--purple); color: #fff; font: 900 26px Nunito; display: grid; place-items: center; flex: none; }
.tag { font: 800 18px Nunito; padding: 4px 12px; border-radius: 999px; }

/* phone */
.phone { position: absolute; width: 470px; height: 940px; border-radius: 70px; background: #1C2133; padding: 18px; box-shadow: 0 30px 80px rgba(31,42,68,.35); }
.phone .scr { position: relative; width: 100%; height: 100%; border-radius: 54px; background: #FFFaf2; overflow: hidden; }
.phone .notch { position: absolute; top: 14px; left: 50%; width: 120px; height: 30px; margin-left: -60px; border-radius: 20px; background: #1C2133; z-index: 5; }
.app-h { height: 150px; padding: 62px 28px 0; background: linear-gradient(135deg, var(--purple), #9567AE); color: #fff; display: flex; align-items: center; gap: 14px; }
.app-h img { width: 64px; height: 64px; border-radius: 50%; background: var(--cream); }
.app-h .n { font: 900 32px "Baloo 2"; line-height: 1; }
.app-h .s { font: 700 17px Nunito; opacity: .9; }
.step { display: flex; align-items: center; gap: 16px; padding: 10px 0; }
.dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 900 22px Nunito; color: #fff; background: #CFD3DC; flex: none; }
.msg { max-width: 330px; padding: 14px 18px; border-radius: 22px; font: 700 21px/1.35 Nunito, "Noto Sans TC"; margin: 10px 0; }
.msg.me { margin-left: auto; background: var(--purple); color: #fff; border-bottom-right-radius: 6px; }
.msg.bot { background: #fff; border-bottom-left-radius: 6px; box-shadow: 0 4px 12px rgba(31,42,68,.08); }
.src { display: inline-flex; align-items: center; gap: 6px; background: var(--green-l); color: var(--green-d); font: 800 16px Nunito; padding: 6px 12px; border-radius: 999px; margin: 6px 6px 0 0; }
.feat { position: absolute; width: 400px; padding: 30px 30px 26px; }
.feat .ic { width: 96px; height: 96px; border-radius: 28px; display: grid; place-items: center; margin-bottom: 18px; }
.feat .t { font: 900 34px/1.12 Nunito; }
.req { display: inline-block; margin: 12px 8px 0 0; padding: 6px 14px; border-radius: 10px; background: var(--navy); color: #fff; font: 800 20px Nunito; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="ui" class="layer"></div>
  <div id="lt"><div class="ic"></div><div><div class="k">Feature</div><div class="v"></div></div></div>
  <div id="wipe"><div style="background:#7B4B94"></div><div style="background:#F28C28;flex:.35"></div><div style="background:#4CAF50;flex:.25"></div></div>
  <div id="subs"><div class="bar" style="display:none"></div></div>
  <div id="fontwarm" class="zh" style="position:absolute;left:-9999px;top:0;font-size:20px"></div>
</div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<script type="module" src="./main.js"></script>
</body>
</html>
