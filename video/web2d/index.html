<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>POTATO 2D video renderer</title>
<link rel="stylesheet" href="/node_modules/@fontsource/nunito/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/nunito/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/nunito/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/nunito/900.css">
<link rel="stylesheet" href="/node_modules/@fontsource/baloo-2/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/baloo-2/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-tc/500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-tc/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-tc/900.css">
<style>
:root {
  --purple: #7B4B94; --purple-d: #5A3370; --purple-l: #EDE3F3;
  --orange: #F28C28; --orange-d: #C96A10; --orange-l: #FFE6CC;
  --green: #4CAF50; --green-d: #2E7D32; --green-l: #E3F2E1;
  --cream: #FFF4E0; --navy: #1F2A44; --navy-2: #46506A; --red: #E0544B;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
body { font-family: Nunito, "Noto Sans TC", sans-serif; color: var(--navy); }
.zh { font-family: "Noto Sans TC", Nunito, sans-serif; }
#stage { position: absolute; inset: 0; overflow: hidden; }
svg#world { position: absolute; inset: 0; }
#ui { position: absolute; inset: 0; }
.scene-ui { position: absolute; inset: 0; display: none; }
.abs { position: absolute; }

/* subtitles */
#subs { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; z-index: 50; }
#subs .bar { background: rgba(18, 22, 38, .78); color: #fff; font: 700 38px/1.28 Nunito, "Noto Sans TC"; padding: 10px 30px 12px; border-radius: 16px; text-align: center; max-width: 1400px; }
/* lower third */
#lt { position: absolute; left: 56px; top: 48px; z-index: 40; display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 999px; padding: 10px 28px 10px 12px; box-shadow: 0 10px 30px rgba(31,42,68,.18); opacity: 0; }
#lt .ic { width: 50px; height: 50px; border-radius: 50%; background: var(--purple); display: grid; place-items: center; }
#lt .k { font: 800 16px Nunito; letter-spacing: 2px; color: var(--orange); text-transform: uppercase; }
#lt .v { font: 900 28px Nunito; color: var(--navy); line-height: 1.05; }
/* scene wipe */
#wipe { position: absolute; inset: -10%; z-index: 45; transform: translateX(-130%) skewX(-12deg); display: flex; }
#wipe div { flex: 1; }

.card { background: #fff; border-radius: 28px; box-shadow: 0 18px 50px rgba(31,42,68,.16); }
.chip { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 8px 20px; font: 800 24px Nunito; white-space: nowrap; }
.h1 { font: 800 64px/1.05 "Baloo 2", Nunito; color: var(--navy); }
.h2 { font: 800 42px/1.1 "Baloo 2", Nunito; color: var(--navy); }
.k { font: 800 18px Nunito; letter-spacing: 2px; color: var(--orange); text-transform: uppercase; }
.muted { color: var(--navy-2); }
.frost { background: rgba(255,246,230,.62); backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px); }
#vig { position: absolute; inset: 0; z-index: 30; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 45%, rgba(0,0,0,0) 60%, rgba(20,16,40,.28) 100%); }
#light { position: absolute; inset: 0; z-index: 31; pointer-events: none; background: radial-gradient(ellipse 60% 50% at 88% 6%, rgba(255,226,170,.22), rgba(255,226,170,0) 70%); mix-blend-mode: screen; }
#grain { position: absolute; inset: -64px; z-index: 32; pointer-events: none; opacity: .06; mix-blend-mode: overlay; }
.tap { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(242,140,40,.35); border: 4px solid var(--orange); opacity: 0; }

/* the post's touchscreen, enlarged (Figma-style UI) */
.scr { position: absolute; width: 1040px; height: 600px; border-radius: 44px; background: var(--navy); padding: 18px; box-shadow: 0 30px 80px rgba(31,42,68,.35); transform-origin: 0 0; }
.scr .in { position: relative; width: 100%; height: 100%; border-radius: 30px; background: linear-gradient(180deg, #FFF8EC, #FFE2BC); overflow: hidden; }
.scr .lbl { position: absolute; left: 34px; top: -46px; font: 800 20px Nunito; color: var(--purple); letter-spacing: 1.5px; }
.pane { position: absolute; inset: 0; padding: 26px 40px; }
.hdr { display: flex; align-items: center; gap: 14px; }
.melb { width: 58px; height: 58px; }
.issue { display: flex; align-items: center; gap: 18px; background: #fff; border-radius: 22px; padding: 12px 20px; margin-bottom: 12px; box-shadow: 0 6px 16px rgba(31,42,68,.08); border: 3px solid transparent; }
.issue .ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.issue .t { font: 900 28px Nunito; }
.issue .m { font: 700 20px Nunito; color: var(--navy-2); margin-top: 2px; }
.rank { width: 44px; height: 44px; border-radius: 50%; background: var(--purple); color: #fff; font: 900 24px Nunito; display: grid; place-items: center; flex: none; }
.tag { font: 800 18px Nunito; padding: 4px 12px; border-radius: 999px; }

/* phone */
.phone { position: absolute; width: 440px; height: 880px; border-radius: 64px; background: #1C2133; padding: 16px; box-shadow: 0 30px 80px rgba(31,42,68,.35); }
.phone .ps { position: relative; width: 100%; height: 100%; border-radius: 50px; background: #FFFAF2; overflow: hidden; }
.phone .notch { position: absolute; top: 12px; left: 50%; width: 110px; height: 28px; margin-left: -55px; border-radius: 20px; background: #1C2133; z-index: 5; }
.app-h { height: 140px; padding: 56px 26px 0; background: linear-gradient(135deg, var(--purple), #9C6DB8); color: #fff; display: flex; align-items: center; gap: 12px; }
.app-h .n { font: 800 30px "Baloo 2"; line-height: 1; }
.app-h .s { font: 700 16px Nunito; opacity: .9; }
.step { display: flex; align-items: center; gap: 16px; padding: 10px 0; }
.dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 900 22px Nunito; color: #fff; background: #CFD3DC; flex: none; }
.msg { max-width: 320px; padding: 14px 18px; border-radius: 22px; font: 700 20px/1.4 Nunito, "Noto Sans TC"; margin: 10px 0; }
.msg.me { margin-left: auto; background: var(--purple); color: #fff; border-bottom-right-radius: 6px; }
.msg.bot { background: #fff; border-bottom-left-radius: 6px; box-shadow: 0 4px 12px rgba(31,42,68,.08); }
.src { display: inline-flex; align-items: center; gap: 6px; background: var(--green-l); color: var(--green-d); font: 800 15px Nunito; padding: 5px 11px; border-radius: 999px; margin: 6px 6px 0 0; }
.feat { position: absolute; width: 400px; padding: 28px 28px 24px; }
.feat .ic { width: 92px; height: 92px; border-radius: 26px; display: grid; place-items: center; margin-bottom: 16px; }
.feat .t { font: 900 32px/1.12 Nunito; }
.req { display: inline-block; margin: 12px 8px 0 0; padding: 5px 13px; border-radius: 10px; background: var(--navy); color: #fff; font: 800 19px Nunito; }
.bubble { position: absolute; background: #fff; border-radius: 26px; padding: 12px 28px; font: 800 42px "Baloo 2", "Noto Sans TC"; color: var(--purple); box-shadow: 0 10px 30px rgba(31,42,68,.2); white-space: nowrap; transform-origin: 20% 100%; }
.bubble:after { content: ""; position: absolute; left: 34px; bottom: -18px; border: 12px solid transparent; border-top: 16px solid #fff; border-left: 12px solid #fff; }
.thought { position: absolute; background: #fff; border-radius: 40px; padding: 18px 30px; box-shadow: 0 10px 30px rgba(31,42,68,.18); }
</style>
</head>
<body>
<div id="stage">
  <svg id="world" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <div id="ui"></div>
  <div id="vig"></div><div id="light"></div><div id="grain"></div>
  <div id="lt"><div class="ic"></div><div><div class="k">Feature</div><div class="v"></div></div></div>
  <div id="wipe"><div style="background:#7B4B94"></div><div style="background:#F28C28;flex:.35"></div><div style="background:#4CAF50;flex:.25"></div></div>
  <div id="subs"><div class="bar" style="display:none"></div></div>
  <div id="fontwarm" class="zh" style="position:absolute;left:-9999px;top:0;font-size:20px"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
