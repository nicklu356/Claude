<style>
*{box-sizing:border-box;margin:0}

<div class="paper"></div>
<svg class="r" id="svg" width="1920" height="1080"></svg>
<div id="layer"></div>
<script>
const f = new URLSearchParams(location.search).get('f') || '1';
const svg = document.getElementById('svg'), rc = rough.svg(svg), L = document.getElementById('layer');
const ink = {stroke:'#2b2b2b', strokeWidth:3.2, roughness:1.6, bowing:1.2};
const add = n => svg.appendChild(n);
const html = s => L.insertAdjacentHTML('beforeend', s);
const arrow = (x1,y1,x2,y2,c='#d0452f') => {
  add(rc.curve([[x1,y1],[(x1+x2)/2+30,(y1+y2)/2-40],[x2,y2]],{...ink,stroke:c}));
  const a=Math.atan2(y2-y1,x2-x1);
  [a+2.6,a-2.6].forEach(t=>add(rc.line(x2,y2,x2+28*Math.cos(t),y2+28*Math.sin(t),{...ink,stroke:c})));
};
// hand-drawn person (Jason) with dog
function jason(x,y,s=1){
  const o={...ink,strokeWidth:3.6};
  add(rc.circle(x,y,90*s,{...o,fill:'#f3d3b5',fillStyle:'solid'}));           // head
  add(rc.path(`M${x-46*s} ${y-10*s} Q${x} ${y-80*s} ${x+46*s} ${y-12*s}`,{...o,fill:'#2b2b2b',fillStyle:'solid'})); // hair
  add(rc.rectangle(x-55*s,y+52*s,110*s,170*s,{...o,fill:'#5b8def',fillStyle:'hachure',hachureGap:9})); // body
  add(rc.line(x-55*s,y+70*s,x-95*s,y+200*s,o)); add(rc.line(x+55*s,y+70*s,x+100*s,y+190*s,o)); // arms
  add(rc.line(x-30*s,y+222*s,x-38*s,y+380*s,o)); add(rc.line(x+30*s,y+222*s,x+40*s,y+380*s,o)); // legs
  add(rc.line(x+100*s,y+190*s,x+230*s,y+300*s,{...o,stroke:'#7a4fd6'}));    // leash
  const dx=x+270*s, dy=y+330*s;                                             // dog
  add(rc.ellipse(dx,dy,120*s,60*s,{...o,fill:'#e9c48a',fillStyle:'solid'}));
  add(rc.circle(dx-55*s,dy-35*s,50*s,{...o,fill:'#e9c48a',fillStyle:'solid'}));
  [[-35,25],[35,25]].forEach(([a,b])=>add(rc.line(dx+a*s,dy+b*s,dx+a*s,dy+55*s,o)));
  add(rc.line(dx+60*s,dy-5*s,dx+90*s,dy-35*s,o));
}

if (f==='1') {               // ---------- PERSONA
  html(`<div class="tag"><b>03</b>Persona</div>`);
  add(rc.line(0,900,1920,900,{...ink,strokeWidth:2,roughness:2.5}));
  // park fence + tree, sketched
  for(let i=0;i<7;i++) add(rc.line(1180+i*70,760,1180+i*70,900,{...ink,strokeWidth:2.4}));
  add(rc.line(1160,790,1650,790,{...ink,strokeWidth:2.4}));
  add(rc.circle(1720,640,260,{...ink,fill:'#9fd39a',fillStyle:'zigzag',hachureGap:10}));
  add(rc.rectangle(1705,760,30,140,{...ink,fill:'#a07850',fillStyle:'solid'}));
  // park sign
  add(rc.rectangle(1330,560,300,130,{...ink,fill:'#fff',fillStyle:'solid'}));
  add(rc.line(1480,690,1480,790,ink));
  html(`<div class="hand" style="position:absolute;left:1345px;top:572px;width:270px;text-align:center;font-size:34px;line-height:1.1">NEW RULE:<br>Dogs on leash<br>7am–7pm</div>`);
  jason(860,470,1);
  // thought bubble
  add(rc.ellipse(560,300,360,190,{...ink,fill:'#fff',fillStyle:'solid'}));
  add(rc.circle(700,400,34,ink)); add(rc.circle(760,440,20,ink));
  html(`<div class="hand" style="position:absolute;left:400px;top:240px;width:320px;text-align:center;font-size:40px;line-height:1.15">Who do I tell?<br>What words do I use?</div>`);
  html(`<div class="sticky" style="left:110px;top:520px">
    <div class="hand" style="font-size:54px">Jason Lee, 30s</div>
    <div class="hand">• Immigrant, 5–10 yrs in Melb<br>• English isn't his 1st language<br>• Walks his dog every day<br>• Doesn't know which dept.</div></div>`);
  html(`<div class="sub">He's unhappy about the new park rule — but doesn't know who to tell.</div>`);
}

if (f==='2') {               // ---------- DISCOVER & SPEAK: real sketch + crisp UI
  html(`<div class="tag"><b>05</b>Understand &amp; speak</div>`);
  add(rc.line(0,960,1920,960,{...ink,strokeWidth:2,roughness:2.5}));
  html(`<img src="kiosk.png" style="position:absolute;left:520px;top:360px;height:600px;mix-blend-mode:multiply">`);
  jason(150,450,1.2);
  // zoom lines from the kiosk screen to the UI panel
  add(rc.line(712,442,880,152,{...ink,strokeWidth:2,stroke:'#7a4fd6',roughness:1}));
  add(rc.line(712,528,880,662,{...ink,strokeWidth:2,stroke:'#7a4fd6',roughness:1}));
  add(rc.rectangle(548,442,164,86,{...ink,stroke:'#7a4fd6',strokeWidth:3}));
  html(`<div class="ui" style="left:880px;top:150px;width:760px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span class="pill p1">公園 Parks</span><span class="pill p2">⏱ 5 天後截止</span><span style="flex:1"></span>
      <span class="pill" style="background:#f2f2f2;color:#555">繁中 ▾</span></div>
    <h3>公園遛狗新規定</h3><div class="en">Park rule changes · 120 m from here</div>
    <p>市議會打算在小公園裡的 <mark>無牽繩區</mark>，平日早上 7 點到晚上 7 點，狗狗都必須牽繩。</p>
    <div class="card" style="font:500 21px/1.5 'Noto Sans TC';margin:4px 0 22px">💡 <b>無牽繩區 (off-leash area)</b>：可以讓狗狗不牽繩自由活動的區域</div>
    <div style="font:700 18px Nunito;color:#888;margin-bottom:18px">Source: City of Melbourne · Parks &amp; Open Space ✓</div>
    <div class="btn"><div class="mic">🎙</div>跟 Melb 說說你的想法 · Tell Melb</div></div>`);
  html(`<div class="hand note" style="left:1660px;top:330px;width:250px">plain-language<br>summary!</div>`);
  arrow(1700,440,1560,520);
  html(`<div class="hand note" style="left:1660px;top:690px;width:250px;color:#7a4fd6">speak in<br>your language</div>`);
  arrow(1660,700,1612,640,'#7a4fd6');
  html(`<div class="sub">A plain-language summary appears in his own language.</div>`);
}

if (f==='3') {               // ---------- NFC + TRACKING
  html(`<div class="tag"><b>06</b>Track</div>`);
  html(`<img src="head.png" style="position:absolute;left:150px;top:300px;height:300px;mix-blend-mode:multiply">`);
  html(`<img src="himelb.png" style="position:absolute;left:110px;top:150px;height:120px;mix-blend-mode:multiply">`);
  // NFC waves, sketched
  [60,110,160].forEach(r=>add(rc.arc(560,560,r*2,r*2,-0.9,0.9,false,{...ink,stroke:'#7a4fd6'})));
  html(`<div class="hand" style="position:absolute;left:300px;top:700px;font-size:46px;color:#7a4fd6">tap NFC → saved to phone</div>`);
  html(`<div class="hand" style="position:absolute;left:140px;top:800px;font-size:40px;color:#1c8a4a">✓ Nothing stored on the post</div>`);
  // hand holding phone, sketched
  html(`<div class="phone" style="left:860px;top:110px">
    <div class="hd">Hi Melb</div><div style="font:700 18px Nunito;color:#999">My issues</div>
    <div class="card"><b style="font:800 22px 'Noto Sans TC'">公園遛狗新規定</b><br>
      <span style="font:500 17px 'Noto Sans TC';color:#777">Parks &amp; Open Space · 已送出意見</span></div>
    <div class="step"><div class="dot done">✓</div><div><b>Received 已收到</b><span>12 Oct · Ref #CASE-2026-0417</span></div></div>
    <div class="step"><div class="dot now">•</div><div><b>In review 審核中</b><span>Parks &amp; Open Space team</span></div></div>
    <div class="step"><div class="dot todo"></div><div><b style="color:#aaa">Outcome 結果</b><span>Decision + reasons</span></div></div>
    <div class="card" style="background:#fff6e6;font:500 18px 'Noto Sans TC'">🔔 狀態更新時通知我　<b style="float:right;color:#7a4fd6">ON</b></div></div>`);
  html(`<div class="hand note" style="left:1350px;top:420px;width:420px">he can see where<br>his voice goes</div>`);
  arrow(1340,500,1250,480);
  html(`<div class="sub">Every stage is visible: Received → In review → Outcome.</div>`);
}
</script></body></html>
